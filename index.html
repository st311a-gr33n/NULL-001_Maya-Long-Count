<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ST3114-GR33N // NULL-001</title>
  <link rel="icon" href="favicon/favicon_dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon/favicon_light.svg" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="interface">
    <section class="temporal-display" aria-label="Maya Long Count calendar">
      <div class="readout" id="readout" aria-label="Long Count date and current time"></div>

      <div class="inspection" id="inspection" aria-live="polite">
        <span class="inspection-unit">—</span>
        <span class="inspection-value">—</span>
        <span class="inspection-days">—</span>
      </div>

      <button class="convert" id="convert" type="button">
        <span class="convert-label">TOTAL DAYS</span>
        <span class="convert-value" id="totalDays">—</span>
        <span class="convert-years" id="totalYears">—</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span><span class="footer-accent">ST3114-GR33N</span> // NULL</span>
    <span>Project ID: <a href="https://github.com/st311a-gr33n/NULL-001_Maya-Long-Count">NULL-001</a></span>
    <a href="https://github.com/st311a-gr33n" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <div class="isotype-watermark" aria-hidden="true">
    <img src="assets/st3114-gr33n-isotype.svg" alt="" />
  </div>

  <script src="script.js"></script>
</body>
</html>

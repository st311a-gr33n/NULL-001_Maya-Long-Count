<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>ST3114-GR33N // NULL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="interface">
    <section class="temporal-display" aria-label="Maya Long Count calendar">
      <div class="readout" id="readout" aria-label="Long Count date and current time"></div>

      <div class="inspection" id="inspection" aria-live="polite">
        <span class="inspection-unit">—</span>
        <span class="inspection-value">—</span>
        <span class="inspection-days">—</span>
      </div>

      <button class="convert" id="convert" type="button">
        <span class="convert-label">TOTAL DAYS</span>
        <span class="convert-value" id="totalDays">—</span>
        <span class="convert-years" id="totalYears">—</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span><span class="footer-accent">ST3114-GR33N</span> // NULL</span>
    <span>Project ID: <a>NULL-001</a></span>
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
